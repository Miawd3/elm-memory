name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install local package
        run: python -m pip install --disable-pip-version-check -e ".[mcp]"

      - name: Compile Python sources
        run: python -m compileall -q src tests benchmarks

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  benchmark:
    name: Sanitized benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install local package
        run: python -m pip install --disable-pip-version-check -e ".[mcp]"

      - name: Run sanitized benchmark
        run: python benchmarks/run_benchmark.py --assert-pass

      - name: Run governed-memory lifecycle demo
        run: python benchmarks/run_governance_demo.py --assert-pass

      - name: Run read-only MCP equivalence demo
        run: python benchmarks/run_mcp_demo.py --assert-pass

      - name: Run proposal-only MCP safety demo
        run: python benchmarks/run_phase5a_demo.py --assert-pass

      - name: Run proposal-only multi-agent soak pilot
        run: python benchmarks/run_phase5a_soak.py --assert-pass
